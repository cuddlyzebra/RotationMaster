<div class="dropdown-container">
  <div class="separator-slot">
    <label
      class="row-break-toggle"
      title="Start a new row in the preview here"
      [style.visibility]="isFirst ? 'hidden' : 'visible'"
      >
      <input
        type="checkbox"
        [ngModel]="isRowBreak"
        (ngModelChange)="onRowBreakToggle($event)"
        [disabled]="isFirst"
        />
      ↵ Row break
    </label>

    @if (isRowBreak) {
      <input
        type="number"
        class="nisinput row-break-gap-input"
        [min]="1"
        [max]="5"
        [ngModel]="rowBreakGap"
        (ngModelChange)="onRowBreakGapChange($event)"
        title="Extra vertical gap before this row (1 = normal gap, higher = more space)"
        />
    } @else {
      <select
        class="nisinput separator-selector"
        [(ngModel)]="abilitySelection.Separator"
        (ngModelChange)="onSeparatorChange($event)"
        [disabled]="isFirst"
        [style.visibility]="isFirst ? 'hidden' : 'visible'"
        >
        @for (sep of separators; track sep) {
          <option [value]="sep">{{ sep || '(none)' }}</option>
        }
      </select>
    }
  </div>

  <rm-search-dropdown
    [items]="abilities"
    [selectedAbility]="abilitySelection.SelectedAbility"
    (afterChange)="onAbilityChange($event)"
  ></rm-search-dropdown>

  <div class="ability-image-container" [class.ability-blank-slot]="isBlankSpacer(abilitySelection.SelectedAbility)">
    @if (abilitySelection.SelectedAbility && !isBlankSpacer(abilitySelection.SelectedAbility)) {
      <img
        class="ability-image"
        [src]="abilitySelection.SelectedAbility.Src"
        [alt]="abilitySelection.SelectedAbility.Emoji"
        />
    }
  </div>

  <div class="notes-with-heading">
    <input
      type="text"
      class="nisinput ability-notes-input"
      [class.heading-input]="isHeading"
      [ngModel]="notesText"
      (ngModelChange)="onNotesTextChange($event)"
      [placeholder]="isHeading ? 'Heading text' : 'Notes'"
      />
    <label class="heading-toggle" title="Render this note as a bold section heading (e.g. Phase 2) instead of a small caption">
      <input
        type="checkbox"
        [ngModel]="isHeading"
        (ngModelChange)="onHeadingToggle($event)"
        />
      Heading
    </label>
    @if (isHeading) {
      <input
        type="number"
        class="nisinput heading-size-input"
        [min]="10"
        [max]="40"
        placeholder="auto"
        title="Font size for just this heading, in px (leave blank to use the global 'Heading Text Size' setting)"
        [ngModel]="headingSize"
        (ngModelChange)="onHeadingSizeChange($event)"
        />

      <div class="heading-color-row">
        <label class="heading-color-toggle" title="Use a different colour for just this heading instead of the global 'Heading Text Color' setting">
          <input
            type="checkbox"
            [ngModel]="isCustomHeadingColor"
            (ngModelChange)="onHeadingColorToggle($event)"
            />
          Custom colour
        </label>
        @if (isCustomHeadingColor) {
          <input
            type="color"
            class="heading-color-input"
            [ngModel]="headingColorValue"
            (ngModelChange)="onHeadingColorChange($event)"
            />
        }
      </div>
    }
  </div>

  <div class="button-dropdown">
    <button
      class="nisbutton copy-button"
      (click)="copyAbility.emit('end')"
      (contextmenu)="$event.preventDefault(); copyMenuVisible = !copyMenuVisible"
      title="Copy Ability (Right-click for more options)"
      [disabled]="!abilitySelection.SelectedAbility"
      >
      <i class="fa-solid fa-copy"></i>
    </button>
    
    <!-- Context Menu -->
    <div class="copy-context-menu" *ngIf="copyMenuVisible" (mouseleave)="copyMenuVisible = false">
      <button class="context-menu-item" (click)="copyAbility.emit('after'); copyMenuVisible = false">
        <i class="fa-solid fa-arrow-right"></i> Copy Here
      </button>
      <button class="context-menu-item" (click)="copyAbility.emit('end'); copyMenuVisible = false">
        <i class="fa-solid fa-arrow-down"></i> Copy to End
      </button>
    </div>
  </div>

  <button
    class="nisbutton delete-button"
    (click)="delete.emit()"
    title="Delete Ability Selection"
    [disabled]="isOnly"
    >
    <i class="fas fa-trash-alt"></i>
  </button>
</div>
